<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comunidad de Propietarios</title>
<meta name="theme-color" content="#13223a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adeudos RY5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* ---- Tokens: despacho de administración · marino, oro champán, porcelana ---- */
:root{
  --bg:#eceef2; --surface:#ffffff; --surface-2:#f5f6f8; --ink:#172034; --muted:#687186; --line:#dde1e8;
  --navy:#13223a; --navy-2:#1c3050; --gold:#ad8a52; --gold-2:#d4b57e; --gold-soft:#efe5d2;
  --banco:#24406b; --ok:#2f6b4f; --ok-soft:#e0ede5; --warn:#8f6420; --warn-soft:#f5ebd6; --err:#8c2f39; --err-soft:#f4e0e2;
  --input:#ffffff; --shadow:0 1px 0 rgba(19,34,58,.04), 0 8px 24px -14px rgba(19,34,58,.28);
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a111d; --surface:#121b2c; --surface-2:#172238; --ink:#e8ebf1; --muted:#8e97aa; --line:#24304a;
    --navy:#0f1a2d; --navy-2:#18294a; --gold:#cdae78; --gold-2:#e2c995; --gold-soft:#2d2717;
    --banco:#8fa8d6; --ok:#73c197; --ok-soft:#14291f; --warn:#dcb66a; --warn-soft:#2c2412; --err:#e3929a; --err-soft:#2e171b;
    --input:#0e1626; --shadow:0 10px 28px -16px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---- Cabecera ---- */
header{position:sticky;top:0;z-index:6;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;border-bottom:1px solid rgba(212,181,126,.45)}
.hrow{display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto}
.crest{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--gold-2);display:flex;align-items:center;justify-content:center;
  font:600 16px/1 var(--display);color:var(--gold-2);letter-spacing:.5px;box-shadow:inset 0 0 0 3px var(--navy), inset 0 0 0 4px rgba(212,181,126,.35)}
.htxt{flex:1;min-width:0}
header h1{margin:0;font:600 18px/1.15 var(--display);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header p{margin:3px 0 0;font-size:12.5px;color:rgba(255,255,255,.66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hact{display:flex;flex-direction:column-reverse;align-items:center;gap:5px;flex:none}
.hact .ver{font-size:10.5px;padding:1px 6px}
.junta{display:flex;flex-wrap:wrap;gap:1px 12px;margin:5px 0 0;padding:0;border:0;background:none;text-align:left;font-size:12px;color:rgba(255,255,255,.6)}
.junta b{color:var(--gold-2);font-weight:600}
.junta i{font-style:normal;font-size:10.5px;color:rgba(255,255,255,.55);border:1px solid rgba(212,181,126,.4);border-radius:4px;padding:0 4px;margin-left:2px}
.fachada .portal{cursor:pointer}
.fachada .portal:active path{fill:#1c3050}
.fachada .portal.llama .pomo{animation:pomo 1.6s ease-in-out infinite}
@keyframes pomo{50%{fill:#fff;r:2.6px}}
.pista{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12px;color:var(--gold-2)}
.pista svg{width:15px;height:15px;flex:none}
.ver{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid rgba(212,181,126,.5);color:var(--gold-2);letter-spacing:.3px}
.upd{border:0;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.09);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.upd svg{width:18px;height:18px}
.upd.girando svg{animation:gira .8s linear infinite}
.upd{position:relative}.upd.nueva{background:var(--gold);color:#13223a}.upd.nueva::after{content:"";position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:50%;background:#e3929a;border:2px solid var(--navy)}
@keyframes gira{to{transform:rotate(360deg)}}

main{padding:16px 16px calc(env(safe-area-inset-bottom) + 96px);max-width:640px;margin:0 auto}

/* ---- Navegación ---- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;
  background:color-mix(in srgb, var(--surface) 88%, transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 4px)}
nav button{flex:1;max-width:120px;border:0;background:none;color:var(--muted);font-size:11px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
nav button svg{width:25px;height:25px}
nav button.on{color:var(--ink)}
nav button.on svg{color:var(--gold)}
nav button.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--gold)}
nav button.on svg *{stroke-dasharray:1;animation:trazo .7s cubic-bezier(.6,0,.3,1) both}
@keyframes trazo{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

/* ---- Superficies ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font:600 18px/1.25 var(--display);letter-spacing:-.2px;color:var(--ink);display:flex;align-items:center;gap:8px}
.card h2 svg{width:20px;height:20px;color:var(--gold);flex:none}
.card h2 .h2r{margin-left:auto;font:500 13px var(--sans);color:var(--muted)}
.sect{font:600 13px var(--sans);color:var(--muted);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---- Portada del panel (fachada) ---- */
.hero{background:radial-gradient(120% 90% at 85% 0%, var(--navy-2) 0%, var(--navy) 60%);color:#fff;border-radius:24px;padding:18px 18px 16px;margin-bottom:14px;
  border:1px solid rgba(212,181,126,.35);box-shadow:0 18px 40px -22px rgba(19,34,58,.75);overflow:hidden;position:relative}
.hero .per{font:500 13px var(--sans);color:var(--gold-2)}
.hero h2{margin:3px 0 0;font:700 clamp(18px,5.3vw,26px)/1.15 var(--display);letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .cuando{margin-top:6px;font-size:clamp(12px,3.6vw,14px);color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .htop{display:flex;gap:10px;align-items:center}.hero .htop>div:first-child{flex:1;min-width:0}
.hero .cuenta{flex:none;text-align:center;min-width:50px;padding:4px 7px 3px;border-radius:10px;border:1px solid rgba(212,181,126,.45)}
.hero .cuenta b{display:block;font:700 18px/1.05 var(--display);color:var(--gold-2)}
.hero .cuenta span{display:block;font-size:9.5px;line-height:1.15;color:rgba(255,255,255,.7)}
.fachada{display:block;width:100%;height:auto;margin:10px 0 4px}
.fachada .win{cursor:pointer}
.fachada .win rect.v{transition:fill .3s, stroke .3s}
.fachada .win:active rect.v{stroke:#fff}
.fachada .win{animation:enciende .5s ease both}
@keyframes enciende{from{opacity:0}to{opacity:1}}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:rgba(255,255,255,.72);margin-top:4px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hero .sum{display:flex;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(212,181,126,.25)}
.hero .sum div{flex:1}
.hero .sum span{display:block;font-size:12px;color:rgba(255,255,255,.62)}
.hero .sum b{font:600 19px/1.2 var(--display)}

/* ---- Reparto y gráfico ---- */
.barra{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.barra i{display:block;height:100%;transform-origin:left;animation:crece .9s cubic-bezier(.3,.7,.2,1) both}
@keyframes crece{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.reparto{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
.reparto>div{display:flex;gap:9px;align-items:flex-start}
.reparto i{flex:none;width:10px;height:10px;border-radius:3px;margin-top:5px}
.reparto span{display:block;font-size:12.5px;color:var(--muted)}
.reparto b{font:600 17px/1.2 var(--display)}
.grafico{display:block;width:100%;height:auto}
.grafico .col{transform-box:fill-box;transform-origin:bottom;animation:sube .8s cubic-bezier(.3,.7,.2,1) both}
@keyframes sube{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.accion{display:flex;flex-direction:column;align-items:flex-start;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--shadow)}
.accion svg{width:26px;height:26px;color:var(--gold)}
.accion b{font:600 15px/1.2 var(--display)}
.accion span{font-size:12.5px;color:var(--muted)}
.accion:active{transform:scale(.98)}
.accion.ancha{grid-column:span 2;flex-direction:row;align-items:center;gap:14px;background:linear-gradient(135deg,var(--surface),var(--gold-soft));border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
.accion.ancha svg{width:34px;height:34px;flex:none}
.accion.ancha span{display:block;margin-top:3px}
.foto-card{display:flex;align-items:center;gap:12px}
.foto{display:block;width:100%;max-height:190px;object-fit:cover;object-position:top;border-radius:12px;border:1px solid var(--line);margin:4px 0 10px}
.foto.escaneando{animation:respira 1.6s ease-in-out infinite}
@keyframes respira{50%{opacity:.6}}
.prog{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:6px 0 8px}
.prog i{display:block;height:100%;width:2%;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .3s}
.mini{flex:none;width:40px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.btn[disabled]{pointer-events:none}
.linea{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
details.texto{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.texto summary{font-size:14px;color:var(--muted);cursor:pointer}
details.texto pre{white-space:pre-wrap;font-size:12px;margin:10px 0 0;max-height:240px;overflow:auto}

/* ---- Formularios ---- */
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--input);
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=checkbox]{width:24px;height:24px;padding:0;flex:none;border-radius:7px;border:1.5px solid var(--gold);background:var(--input);display:inline-grid;place-content:center}
input[type=checkbox]::after{content:"";width:12px;height:7px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) scale(0);margin-top:-3px;transition:transform .15s}
input[type=checkbox]:checked{background:var(--gold);border-color:var(--gold)}
input[type=checkbox]:checked::after{transform:rotate(-45deg) scale(1)}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
input:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}

/* ---- Botones ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;
  padding:14px 16px;font-weight:600;background:var(--navy);color:#fff;width:100%;letter-spacing:.1px;border:1px solid var(--navy)}
.btn svg{width:18px;height:18px;flex:none}
.btn.oro{background:linear-gradient(180deg,var(--gold-2),var(--gold));border-color:var(--gold);color:#1b1405}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.oro):not(.sec):not(.danger){background:var(--gold);border-color:var(--gold);color:#16110a}}
.btn.sec{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--err)}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;border-radius:11px}
.btn:active{transform:scale(.985)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.btns>.btn{flex:1}.btns>.btn.oro{flex:1.8}

/* ---- Texto y etiquetas ---- */
.big{font:600 30px/1.1 var(--display);letter-spacing:-.3px}
.muted{color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.ef{background:var(--gold-soft);color:var(--warn);border-color:transparent}
.chip.frst{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.rcur{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.okc{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.errc{background:var(--err-soft);color:var(--err);border-color:transparent}

/* ---- Listas: placas de puerta ---- */
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item[data-act="editar"]:active{background:var(--surface-2)}
.unit{flex:none;width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font:600 16px/1 var(--display);color:var(--navy);background:linear-gradient(160deg,#f7efdf,#e3cfa8);border:1px solid #c9ab76;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(120,90,40,.25)}
.unit.local{background:linear-gradient(160deg,var(--navy-2),var(--navy));color:var(--gold-2);border-color:#3a4d6e;font-size:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .unit:not(.local){background:linear-gradient(160deg,#d9c294,#a98a55);color:#141a26;border-color:#7d6436}}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amount{width:112px;flex:none;text-align:right;font:600 17px var(--display)}
.amount::placeholder{font-family:var(--sans);font-weight:400;font-size:15px}

/* ---- Avisos ---- */
.alert{border-radius:12px;padding:11px 13px;font-size:14px;margin:10px 0;display:flex;gap:10px}
.alert svg{width:20px;height:20px;flex:none;margin-top:1px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.err{background:var(--err-soft);color:var(--err)}.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert ul{margin:0;padding-left:16px}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;margin:0;color:var(--ink);font-size:15px;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check span{flex:1}

/* ---- Ficheros ---- */
.file{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.fico{flex:none;width:40px;height:48px;position:relative}
.fico svg{width:40px;height:48px;color:var(--line)}
.fico b{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:700 9.5px var(--sans);letter-spacing:.4px;color:#fff;background:var(--banco);margin:0 4px;border-radius:3px;padding:1px 0}
.fico.txt b{background:var(--gold)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;border-top:1px solid var(--ink);margin-top:6px}
.tot .big{font-size:24px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty svg{width:40px;height:40px;color:var(--gold);display:block;margin:0 auto 8px}

/* ---- Diálogos ---- */
dialog{border:0;border-radius:22px;padding:0;width:min(560px,94vw);max-height:88vh;background:var(--surface);color:var(--ink);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
dialog[open]{animation:abre .22s cubic-bezier(.3,.7,.2,1)}
@keyframes abre{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(10,17,29,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog .card{border:0;margin:0;box-shadow:none;border-radius:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 88px);transform:translate(-50%,8px);
  background:var(--navy);color:#fff;border:1px solid rgba(212,181,126,.5);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hrow">
  <div class="crest" aria-hidden="true">R5</div>
  <div class="htxt"><h1>Comunidad de Propietarios</h1><p id="sub"></p><button class="junta" id="junta" data-act="cargos" aria-label="Presidente y vicepresidente"></button></div>
  <div class="hact"><span class="ver" id="ver"></span><button class="upd" id="upd" aria-label="Actualizar la app" title="Actualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button></div>
</div></header>
<main id="main"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fotoImp" accept="image/*" hidden>
<input type="file" id="docImp" accept="application/pdf,image/*" hidden>
<input type="file" id="paqImp" accept=".json,application/json" hidden>
<script src="sepa.js?v=3.5"></script>
<script src="ocr.js?v=3.5"></script>
<script src="app.js?v=3.5"></script>
</body>
</html>
