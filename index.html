<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adeudos Comunidad</title>
<meta name="theme-color" content="#0f3d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adeudos RY5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1d2321; --muted:#6b726e; --line:#e2ddd2;
  --brand:#0f3d3a; --brand-2:#1f6b63; --accent:#c8553d; --ok:#2e7d4f; --warn:#b7791f; --err:#b3261e;
  --chip:#ebe6da; --input:#fff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111614; --card:#1a201e; --ink:#ecebe6; --muted:#9aa29e; --line:#2b3330;
    --brand:#5fb3a7; --brand-2:#7cc7bb; --accent:#e27a63; --ok:#5cbf86; --warn:#e0a84a; --err:#f07067;
    --chip:#252c29; --input:#141917; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 12px}
@media (prefers-color-scheme: dark){header{background:#0c2a27}}
header h1{margin:0;font-size:19px;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:12.5px;opacity:.8}
main{padding:14px 16px calc(env(safe-area-inset-bottom) + 92px);max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:11.5px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--input);
  border:1px solid var(--line);border-radius:10px;padding:10px 11px;appearance:none;-webkit-appearance:none}
input[type=checkbox]{width:22px;height:22px;padding:0;flex:none;appearance:auto;-webkit-appearance:checkbox;accent-color:var(--brand)}
input:focus,select:focus{outline:2px solid var(--brand-2);outline-offset:0}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;
  padding:12px 14px;font:inherit;font-weight:600;background:var(--brand);color:#fff;width:100%}
@media (prefers-color-scheme: dark){.btn{color:#0b1715}}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--err)}
.btn.sm{padding:8px 10px;font-size:14px;width:auto}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btns>.btn{flex:1}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px}
.muted{color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.chip.ef{background:#efe1f7;color:#5b2a7a}
.chip.frst{background:#fde9c8;color:#7a4a00}.chip.rcur{background:#d8efe7;color:#145c47}
@media (prefers-color-scheme: dark){.chip.ef{background:#3a2448;color:#dcb5f2}.chip.frst{background:#4a3410;color:#f4c77a}.chip.rcur{background:#173d33;color:#8fdcc3}}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.unit{flex:none;width:46px;height:46px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.unit.local{background:var(--accent);color:#fff;font-size:12px}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amount{width:108px;flex:none;text-align:right}
.alert{border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.alert.warn{background:#fcf1d9;color:#6b4500}.alert.err{background:#fbe3e1;color:#7c1a14}.alert.ok{background:#e0f2e7;color:#1d5b37}
@media (prefers-color-scheme: dark){.alert.warn{background:#3b2d12;color:#f2cf8b}.alert.err{background:#3d1a18;color:#f4aaa4}.alert.ok{background:#173323;color:#9fe0b8}}
.alert ul{margin:4px 0 0;padding-left:18px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0}
.check span{flex:1}
.file{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:2px solid var(--line);margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .card{border:0;margin:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>Adeudos Comunidad</h1><p id="sub">Av. de Rafaela Ybarra, 5 · Madrid</p></header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="remesa" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Remesa</button>
  <button data-tab="deudores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V9l9-6 9 6v12z"/><path d="M9 21v-6h6v6"/></svg>Deudores</button>
  <button data-tab="historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<script src="sepa.js"></script>
<script src="app.js"></script>
</body>
</html>
